name: Playce

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 63U9A75L6R
    CODE_SIGN_STYLE: Automatic

packages:
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    exactVersion: 1.8.0

targets:
  PlayceIOS:
    type: application
    platform: iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: PLAYCE
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.agm.playce.connectiq
            CFBundleURLSchemes:
              - playce-ciq
        LSApplicationQueriesSchemes:
          - gcm-ciq
        NSBluetoothAlwaysUsageDescription: PLAYCE uses Bluetooth through Garmin Connect IQ to exchange match scores with your Garmin watch.
    sources:
      - path: iOS
      - path: Shared
      - path: Resources
    dependencies:
      - target: PlayceWatchApp
        embed: true
      - package: ConnectIQ
        product: ConnectIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agm.playce
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PlayceWatchApp:
    type: application
    platform: watchOS
    entitlements:
      path: Watch/PlayceWatchApp.entitlements
      properties:
        com.apple.developer.healthkit: true
    sources:
      - path: Watch
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agm.playce.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PLAYCE
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.agm.playce
        INFOPLIST_KEY_NSHealthShareUsageDescription: PLAYCE reads workout data to keep tennis sessions active on Apple Watch.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: PLAYCE writes tennis workouts while you track matches on Apple Watch.
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon

  PlayceSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agm.playce.sharedtests
        GENERATE_INFOPLIST_FILE: YES
